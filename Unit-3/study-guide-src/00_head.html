<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BDA Unit 3 Study Guide</title>
<style>
@page { size: A4; margin: 16mm 15mm 17mm 15mm; }
@page :first { margin: 0; }
:root{
  --ink:#1b2335; --muted:#5b6478; --line:#e3e7ef; --paper:#ffffff;
  --navy:#16244a; --indigo:#3949ab;
  --c1:#0f8b8d; --c1l:#e6f5f5;      /* chapter 1 teal */
  --c2:#6a3fb5; --c2l:#f1ebfb;      /* chapter 2 violet */
  --c3:#d9622b; --c3l:#fdf0e8;      /* chapter 3 orange */
  --key:#f6b100; --keyl:#fff7dc;
  --tip:#1f9d55; --tipl:#e8f7ee;
  --exam:#2463eb; --examl:#e9f0ff;
  --mem:#9c36b5; --meml:#f7ebfb;
  --warn:#d6334a; --warnl:#fdecee;
  --eg:#475569; --egl:#f3f5f8;
  --acc:var(--c1); --accl:var(--c1l);
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact; print-color-adjust:exact}
body{margin:0; font-family:"Inter","Liberation Sans",sans-serif; color:var(--ink); font-size:10.4pt; line-height:1.55; background:var(--paper)}
p{margin:.35em 0 .6em}
ul,ol{margin:.3em 0 .7em; padding-left:1.35em}
li{margin:.18em 0}
b,strong{font-weight:650}
mark{background:linear-gradient(transparent 38%, #ffe680 38%, #ffe680 92%, transparent 92%); color:inherit; padding:0 .08em}
.hl-acc{color:var(--acc); font-weight:650}
code,.mono{font-family:"DejaVu Sans Mono",monospace; font-size:.86em; background:#f1f3f8; padding:.05em .3em; border-radius:4px}
.marker{font-size:1px; color:#fff; line-height:1px; margin:0}
span.marker{color:#fff; font-size:1px}
.ch1{--acc:var(--c1); --accl:var(--c1l)} .ch2{--acc:var(--c2); --accl:var(--c2l)} .ch3{--acc:var(--c3); --accl:var(--c3l)}

/* ---------- cover ---------- */
.cover{height:295mm; width:210mm; position:relative; overflow:hidden; background:var(--navy); color:#fff; break-after:page}
.cover .grid{position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size:12mm 12mm}
.cover .blob{position:absolute; border-radius:50%; filter:blur(0px); opacity:.9}
.cover .inner{position:absolute; left:20mm; right:20mm; top:30mm}
.cover .tag{display:inline-block; font-size:10pt; letter-spacing:.18em; text-transform:uppercase; background:rgba(255,255,255,.12); padding:2mm 4mm; border-radius:20mm}
.cover h1{font-family:"Inter Display","Inter",sans-serif; font-size:46pt; line-height:1.02; margin:10mm 0 4mm; font-weight:800; letter-spacing:-.01em}
.cover h1 span{color:#ffd166}
.cover .sub{font-size:15pt; color:#cfd8f5; margin:0 0 12mm}
.cover .chips{display:flex; flex-direction:column; gap:4mm; margin-top:6mm}
.cover .chip{display:flex; align-items:center; gap:5mm; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:4mm; padding:4mm 5mm}
.cover .chip .n{width:12mm; height:12mm; border-radius:3mm; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16pt; color:#fff; flex:none}
.cover .chip .t{font-weight:700; font-size:13pt}
.cover .chip .d{font-size:9.5pt; color:#c8d0ea}
.cover .foot{position:absolute; left:20mm; right:20mm; bottom:18mm; display:flex; justify-content:space-between; font-size:9.5pt; color:#b9c3e6; border-top:1px solid rgba(255,255,255,.18); padding-top:4mm}

/* ---------- headings ---------- */
h1.page-title{font-family:"Inter Display","Inter";font-size:24pt; margin:0 0 3mm; color:var(--navy); letter-spacing:-.01em}
.lead{font-size:10.6pt; color:var(--muted); margin:0 0 3mm}
.chapter-open{break-before:page; position:relative; border-radius:6mm; padding:12mm 11mm 10mm; margin-bottom:7mm; background:var(--acc); color:#fff; overflow:hidden}
.chapter-open .bg{position:absolute; right:-18mm; top:-18mm; width:80mm; height:80mm; border-radius:50%; background:rgba(255,255,255,.10)}
.chapter-open .bg2{position:absolute; right:22mm; bottom:-28mm; width:50mm; height:50mm; border-radius:50%; background:rgba(255,255,255,.08)}
.chapter-open .num{font-size:11pt; letter-spacing:.2em; text-transform:uppercase; opacity:.85}
.chapter-open h1{font-family:"Inter Display","Inter"; font-size:30pt; line-height:1.08; margin:2mm 0 4mm; font-weight:800}
.chapter-open .learn{background:rgba(255,255,255,.13); border-radius:4mm; padding:4mm 5mm; font-size:10pt; position:relative}
.chapter-open .learn b{display:block; margin-bottom:1mm; font-size:10.5pt}
.chapter-open .learn ol{columns:2; column-gap:8mm; margin:0; padding-left:5mm}
.chapter-open .meta{display:flex; gap:4mm; margin-top:4mm; font-size:9.5pt; position:relative}
.chapter-open .meta span{background:rgba(255,255,255,.18); padding:1.2mm 3.5mm; border-radius:10mm}

h2{font-family:"Inter Display","Inter"; font-size:16.5pt; color:var(--navy); margin:8mm 0 3mm; padding-bottom:2mm; border-bottom:2.2px solid var(--acc); display:flex; align-items:center; gap:3mm; break-after:avoid; letter-spacing:-.005em}
h2 .no{background:var(--acc); color:#fff; font-size:10.5pt; border-radius:2mm; padding:.8mm 2.6mm; font-weight:700; flex:none}
h2.newpage{break-before:page; margin-top:0}
h3{font-size:12.4pt; color:var(--acc); margin:5.5mm 0 1.8mm; break-after:avoid}
h3::before{content:""; display:inline-block; width:2.4mm; height:2.4mm; border-radius:1mm; background:var(--acc); margin-right:2.4mm; vertical-align:middle; position:relative; top:-.4mm}
h4{font-size:10.8pt; margin:3.5mm 0 1mm; color:var(--ink); break-after:avoid}

/* ---------- callout boxes ---------- */
.box{border-radius:3mm; padding:3mm 4.2mm 2.6mm; margin:3.5mm 0 4mm; border-left:4px solid; break-inside:avoid; font-size:10pt}
.box .bt{font-weight:750; font-size:9pt; letter-spacing:.06em; text-transform:uppercase; margin-bottom:1mm; display:flex; align-items:center; gap:2mm}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.box p:first-of-type{margin-top:0}
.box.key{background:var(--keyl); border-color:var(--key)} .box.key .bt{color:#9a6b00}
.box.tip{background:var(--tipl); border-color:var(--tip)} .box.tip .bt{color:var(--tip)}
.box.exam{background:var(--examl); border-color:var(--exam)} .box.exam .bt{color:var(--exam)}
.box.mem{background:var(--meml); border-color:var(--mem)} .box.mem .bt{color:var(--mem)}
.box.warn{background:var(--warnl); border-color:var(--warn)} .box.warn .bt{color:var(--warn)}
.box.eg{background:var(--egl); border-color:var(--eg)} .box.eg .bt{color:var(--eg)}
.box.simple{background:var(--accl); border-color:var(--acc)} .box.simple .bt{color:var(--acc)}
.def{background:#fff; border:1.5px solid var(--acc); border-radius:3mm; padding:3mm 4.2mm; margin:3mm 0 4mm; break-inside:avoid; position:relative}
.def .dt{display:inline-block; background:var(--acc); color:#fff; font-size:7.8pt; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.3mm 2.4mm; border-radius:2mm; margin-bottom:.8mm}
.def p{margin:.6mm 0}

/* ---------- tables ---------- */
table.t.long{break-inside:auto} table.t.long tr{break-inside:avoid}
table.t{width:100%; border-collapse:separate; border-spacing:0; margin:3mm 0 4.5mm; font-size:9.4pt; break-inside:avoid; border:1px solid var(--line); border-radius:3mm; overflow:hidden}
table.t th{background:var(--acc); color:#fff; text-align:left; padding:2mm 2.6mm; font-weight:650}
table.t td{padding:1.8mm 2.6mm; border-top:1px solid var(--line); vertical-align:top}
table.t tr:nth-child(even) td{background:#fafbfd}
table.t td:first-child{font-weight:600}
table.t.plain td:first-child{font-weight:400}
.caption{font-size:8.6pt; color:var(--muted); text-align:center; margin:-2.5mm 0 4mm; font-style:italic}

/* ---------- figures ---------- */
.fig{margin:3.5mm 0 4.5mm; break-inside:avoid; text-align:center}
.fig svg{max-width:100%; height:auto}
.fig .cap{font-size:8.6pt; color:var(--muted); margin-top:1.5mm; font-style:italic}
.flow{display:flex; align-items:stretch; justify-content:center; gap:0; margin:3.5mm 0 4.5mm; break-inside:avoid}
.flow .st{flex:1; background:var(--accl); border:1.4px solid var(--acc); border-radius:2.6mm; padding:2.4mm 2mm; text-align:center; font-size:9pt; line-height:1.35}
.flow .st b{display:block; color:var(--acc); font-size:9.6pt; margin-bottom:.6mm}
.flow.wrap{display:grid; grid-template-columns:repeat(4,1fr); gap:2.4mm}
.flow.wrap .ar{display:none}
.flow .ar{flex:none; width:6mm; display:flex; align-items:center; justify-content:center; color:var(--acc); font-weight:800; font-size:13pt}
.cards{display:grid; gap:3mm; margin:3mm 0 4.5mm; break-inside:avoid}
.cards.c2{grid-template-columns:1fr 1fr} .cards.c3{grid-template-columns:1fr 1fr 1fr} .cards.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{border:1px solid var(--line); border-radius:3mm; padding:2.8mm 3.2mm; background:#fff; font-size:9.4pt; line-height:1.45; break-inside:avoid; border-top:3px solid var(--acc)}
.card h5{margin:0 0 1mm; font-size:10.2pt; color:var(--acc); display:flex; gap:1.8mm; align-items:center}
.card .ic{font-size:12pt}
.card p{margin:0}
.card .ex{display:block; margin-top:1.2mm; font-size:8.6pt; color:var(--muted)}
.pill{display:inline-block; background:var(--accl); color:var(--acc); border:1px solid var(--acc); border-radius:10mm; padding:.2mm 2.4mm; font-size:8.6pt; font-weight:600; margin:.6mm .4mm}
.two{display:grid; grid-template-columns:1fr 1fr; gap:5mm; align-items:start}
.two > *{min-width:0}
.avoid{break-inside:avoid}
.check{background:#fff; border:1.5px dashed var(--acc); border-radius:3mm; padding:3mm 4.5mm; margin:5mm 0; break-inside:avoid}
.check .bt{font-weight:750; color:var(--acc); margin-bottom:1mm}
.check ul{list-style:none; padding-left:0; margin:0}
.check li::before{content:"☐  "; color:var(--acc); font-weight:700}
.qa{border:1px solid var(--line); border-radius:3mm; margin:3mm 0; break-inside:avoid; overflow:hidden}
.qa .q{background:var(--accl); padding:2.2mm 3.5mm; font-weight:650; color:var(--navy)}
.qa .q span{color:var(--acc); margin-right:1.5mm}
.qa .a{padding:2.4mm 3.5mm; font-size:9.8pt}
.qa .a p:first-child{margin-top:0} .qa .a p:last-child, .qa .a ul:last-child{margin-bottom:0}
.small{font-size:8.8pt; color:var(--muted)}
.center{text-align:center}
.pb{break-before:page}

/* ---------- TOC / how-to ---------- */
.toc{border:1px solid var(--line); border-radius:4mm; padding:2mm 5mm; margin-top:3mm}
.toc .row{display:flex; align-items:baseline; gap:2mm; padding:.75mm 0; font-size:9.6pt}
.toc .row.ch{font-weight:750; font-size:10.6pt; margin-top:1.4mm; border-top:1px solid var(--line); padding-top:1.8mm}
.toc .row.ch:first-child{border-top:0; margin-top:0}
.toc .row .dots{flex:1; border-bottom:1.2px dotted #b9c0cf; transform:translateY(-1mm)}
.toc .row .pg{font-variant-numeric:tabular-nums; color:var(--muted); min-width:7mm; text-align:right}
.toc .row.sub{padding-left:7mm}
.toc a{color:inherit; text-decoration:none}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:2mm 4mm; margin:2mm 0}
.legend .box{padding:2.2mm 3.4mm; font-size:9.4pt}
.legend .box{margin:0}
.plan{display:grid; grid-template-columns:repeat(4,1fr); gap:3mm; margin:2mm 0 3mm}
.plan .d{border-radius:3mm; padding:3mm; color:#fff; font-size:9.2pt; line-height:1.4}
.plan .d b{display:block; font-size:10.5pt; margin-bottom:1mm}
.plan .d .tm{display:inline-block; background:rgba(255,255,255,.22); padding:.2mm 2mm; border-radius:6mm; font-size:8.4pt; margin-top:1.5mm}

/* ---------- unit 2 additions ---------- */
pre.code{font-family:"DejaVu Sans Mono",monospace; font-size:7.7pt; background:#0f1b33; color:#d6e2ff; border-radius:3mm; padding:3mm 3.6mm; margin:2mm 0 3mm; line-height:1.48; white-space:pre-wrap; break-inside:avoid}
pre.code .c{color:#8b98bf; font-style:italic} pre.code .k{color:#ffd166} pre.code .s{color:#9be59b} pre.code .t{color:#7fd3ff}
.sn{display:inline-block; min-width:5.6mm; padding:0 1.3mm; border-radius:3mm; background:var(--acc); color:#fff; font-weight:700; font-size:8.2pt; text-align:center; margin-right:1.6mm; line-height:1.6}
ul.stp{list-style:none; padding-left:0} ul.stp > li{margin:1.5mm 0; padding-left:0}
.phase{border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:2.6mm; padding:2.4mm 3.6mm; margin:2.6mm 0; break-inside:avoid; background:#fff}
.phase > b:first-child{display:block; color:var(--acc); font-size:10.4pt; margin-bottom:.6mm}
.phase ul{margin:.6mm 0 0}
</style>
</head>
<body>

<style>
.textbook{display:inline-block; font-size:7.6pt; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:#fff7dc; color:#9a6b00; border:1px solid #f6b100; border-radius:10mm; padding:.2mm 2.4mm; margin-left:2mm; vertical-align:middle}
pre.code.sh{background:#1d2433}
</style>
